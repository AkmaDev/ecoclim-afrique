backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Nouvel article : {{slug}}"
    update: "Modification : {{slug}}"
    delete: "Suppression : {{slug}}"
    uploadMedia: "Image : {{path}}"
    deleteMedia: "Suppression image : {{path}}"

# Test en local : `npm run cms` puis `npm start`, ouvrir http://localhost:8080/admin/
local_backend: true

locale: fr
site_url: https://ecoclimafrique.com
display_url: https://ecoclimafrique.com
logo_url: /assets/images/logo-ecoclim.png

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: actualites
    label: Actualités
    label_singular: Article
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    sortable_fields: [date, title]
    summary: "{{title}} — {{date | date('DD/MM/YYYY')}}{{draft | ternary(' · masqué du site', '')}}"
    preview_path: "actualites/{{slug}}/"
    editor:
      preview: false
    fields:
      - label: Titre de l'article
        name: title
        widget: string
        hint: "Court et clair, par exemple : « Ce que change la nouvelle loi sur l'environnement au Bénin »."
      - label: Date
        name: date
        widget: datetime
        default: "{{now}}"
        date_format: DD/MM/YYYY
        time_format: false
        format: YYYY-MM-DD
        hint: "Date affichée sous l'article. Par défaut, la date du jour."
      - label: Catégorie
        name: category
        widget: select
        hint: "Le domaine dont parle l'article."
        options:
          - Droit de l'Environnement
          - Marchés Carbone
          - Décarbonisation
          - Gestion des Catastrophes
          - Gestion de l'Environnement
      - label: Résumé
        name: excerpt
        widget: text
        hint: "1 ou 2 phrases. Elles apparaissent sous le titre, sur la page Actualités et sur l'accueil."
      - label: Photo de l'article
        name: image
        widget: image
        required: false
        choose_url: false
        hint: "Facultatif. Une photo en format paysage (plus large que haute) s'affiche le mieux."
      - label: "Masquer cet article du site"
        name: draft
        widget: boolean
        default: false
        hint: "Activez pour garder l'article de côté sans qu'il soit visible (brouillon). Désactivez pour qu'il apparaisse."
      - label: Texte de l'article
        name: body
        widget: markdown
        modes: [rich_text]
        buttons: [bold, italic, heading-two, heading-three, bulleted-list, numbered-list, quote, link]
        editor_components: [image]
        hint: "Pour un intertitre : placez le curseur sur la ligne, cliquez sur H puis « Intertitre ». Pour revenir au texte normal : H puis cliquez à nouveau sur le même choix (ou Ctrl+Z pour annuler)."
