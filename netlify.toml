[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# CSS/JS — short cache (query param versionning for cache-busting)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images ajoutées depuis le tableau de bord : jamais figées en cache
# (sinon un « introuvable » vu pendant la rédaction reste bloqué dans le navigateur)
[[headers]]
  for = "/assets/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML — never cache (always fresh)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Tableau de bord — jamais en cache
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Redirects
[[redirects]]
  from = "/index"
  to = "/"
  status = 301

[[redirects]]
  from = "/accueil"
  to = "/"
  status = 301

# Ancienne adresse (avec accents) du premier article
[[redirects]]
  from = "/actualites/2026-10-la-g%C3%A9opolitque-%C3%A0-l%C3%A8re-de-lia/"
  to = "/actualites/2026-10-la-geopolitique-a-l-ere-de-l-ia/"
  status = 301
  force = true

[[redirects]]
  from = "/actualites/2026-10-la-géopolitque-à-lère-de-lia/"
  to = "/actualites/2026-10-la-geopolitique-a-l-ere-de-l-ia/"
  status = 301
  force = true
